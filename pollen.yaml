# yaml-language-server: $schema=https://raw.githubusercontent.com/groupbees/pollen/main/schema/pollen.schema.json
#
# Deploys this module's own skills into THIS repo (.claude/skills and
# .agents/skills, both gitignored), so an agent working on the catalog uses the
# catalog. CI runs `pollen validate` on it.
#
# To install this module on your machine or in a project, do NOT point at this
# file: declare the module's git repo as a source in your own pollen.yaml (see
# the README).
repos:
  - repo: local
    paths:
      - path: skills
        recurse: true
